<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeApp · Pokédex</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="#inicio" aria-label="PokeApp, inicio">
      <img src="./assets/img/logo-pokemon.svg" alt="Pokémon">
    </a>
    <nav aria-label="Menú principal">
      <a href="#inicio">Inicio</a>
      <a href="#pokedex">Pokédex</a>
      <a href="#batalla">Batalla</a>

  <p id="sesion" class="sesion" hidden></p>

  <footer>PokeApp · Proyecto educativo de JavaScript</footer>
  <script type="module" src="./js/app.js"></script>
