<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokeapp | GTA Style</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <p class="eyebrow">Pokeapp · San Andreas edition</p>
        <h1>POKE<span>APP</span></h1>
        <p class="tagline">Una Pokédex simple con un toque de Los Santos.</p>
        <button id="randomButton" type="button">Encontrar uno</button>
      </section>

      <section class="card" aria-live="polite">
        <img id="pokemonImage" src="assets/img/pokeball.svg" alt="Poké Ball" />
        <div>
          <p class="label">Pokémon de la zona</p>
          <h2 id="pokemonName">Todavía no hay ninguno</h2>
          <p id="pokemonInfo">Tocá el botón y vemos cuál aparece.</p>
        </div>
      </section>
    </main>
    <script src="javascript/script.js"></script>
  </body>
</html>
